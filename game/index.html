<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b10">
  <title>风停之前</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D 模式：画布和触摸层（文字模式下隐藏） -->
  <div id="world3d"></div>
  <div id="hud3d">
    <div id="stickBase3d" class="stick-base"><div id="stickKnob3d" class="stick-knob"></div></div>
    <div class="hud3d-right">
      <button id="interactBtn3d" class="hud-btn interact" type="button">交互</button>
      <button id="runBtn3d" class="hud-btn run" type="button">跑</button>
      <button id="rideBrake" class="hud-btn ride-brake" type="button" hidden>刹车</button>
    </div>
  </div>
  <div id="loadBar3d" class="load-bar" hidden></div>
  <section id="leisure" aria-label="自由漫游" hidden>
    <div class="leisure-caption"><strong id="leisureStatus"></strong><span id="leisureDetail"></span></div>
    <span id="mailNote" hidden></span>
    <p id="netSpeech" role="status" hidden></p>
    <div class="roam-vitals" aria-label="身体状态">
      <label>饱腹 <meter id="roamFood" min="0" max="100" low="25" high="45" optimum="90"></meter><output></output></label>
      <label>清洁 <meter id="roamClean" min="0" max="100" low="20" high="40" optimum="90"></meter><output></output></label>
      <label>健康 <meter id="roamHealth" min="0" max="100" low="30" high="50" optimum="90"></meter><output></output></label>
      <label>水分 <meter id="roamWater" min="0" max="100" low="22" high="40" optimum="90"></meter><output></output></label>
      <label>疲劳 <meter id="roamFatigue" min="0" max="100" low="60" high="78" optimum="0"></meter><output></output></label>
      <small id="roamNeedsHint" role="status" hidden></small>
    </div>
    <div class="leisure-actions">
      <button data-do="menu" type="button" aria-expanded="false" aria-controls="leisureOptions">行囊 · 地点</button>
      <button id="mailOffer" data-do="mail" type="button" hidden>接过信</button>
      <div id="flightControls" hidden><button data-do="heightUp" type="button">升高</button><button data-do="heightDown" type="button">降低</button></div>
    </div>
    <div id="leisureOptions" hidden>
      <fieldset><legend>随身物品</legend>
        <button type="button" data-onfoot data-do="water">喝水</button><button type="button" data-onfoot data-do="coffee">喝咖啡</button><button type="button" data-onfoot data-do="smoke">抽烟</button>
      </fieldset>
      <fieldset><legend>前往停放点</legend>
        <button type="button" data-onfoot data-do="bike">自行车</button><button type="button" data-onfoot data-do="boat">手划艇</button><button type="button" data-onfoot data-do="balloon">热气球</button>
      </fieldset>
      <fieldset><legend>吃饭、洗澡与休息</legend>
        <button type="button" data-onfoot data-do="meal">去旧街杂货店</button><button type="button" data-onfoot data-do="shower">去小屋淋浴间</button>
        <button type="button" data-onfoot data-do="sleep">回屋睡觉</button>
      </fieldset>
      <button type="button" data-do="wait">等到下一时段</button>
      <button type="button" data-do="return" hidden>返回停放点并下车</button>
    </div>
  </section>

  <div id="app" data-tone="dark">
    <div id="bgA" class="bg"></div>
    <div id="bgB" class="bg"></div>

    <header id="topbar">
      <button id="notebookBtn" class="pill-btn" type="button" hidden>笔记本</button>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="暂停">Ⅱ</button>
    </header>

    <!-- 3D 自由行走时：左上角是当前提示，下方是没有放进世界里的选项 -->
    <div id="roamCaption" hidden></div>
    <div id="roamBar" hidden></div>
    <div id="sitLine" hidden></div>

    <main id="stage">
      <div id="choices"></div>
    </main>

    <section id="textbox" hidden>
      <div id="speaker"></div>
      <p id="text"></p>
      <span class="more" aria-hidden="true">▼</span>
    </section>

    <div id="toast" aria-live="polite"></div>
    <div id="curtain"></div>

    <div id="title" class="title-screen" hidden>
      <div class="lamp" aria-hidden="true"></div>
      <h1 id="titleName"></h1>
      <p id="titleSub"></p>
      <div id="titleButtons"></div>
    </div>

    <div id="menu" class="menu" hidden>
      <div class="menu-panel" role="dialog" aria-label="暂停">
        <h2>暂停</h2>
        <button id="menuResume" type="button">继续</button>
        <button id="menuSpeed" type="button"></button>
        <button id="menuAssist" type="button"></button>
        <button id="menuMode" type="button"></button>
        <button id="menuShake" type="button"></button>
        <button id="menuSound" type="button"></button>
        <button id="menuExplore" type="button" hidden>进入自由漫游</button>
        <button id="menuTitle" type="button">回到标题</button>
        <button id="menuClear" type="button" class="danger"></button>
      </div>
    </div>
  </div>
  <noscript>需要开启 JavaScript 才能游玩。</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
